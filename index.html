<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050B20" />
  <title>Natal Secreto</title>
  <meta name="description" content="Natal Secreto: a árvore de Natal coletiva do amigo secreto." />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <noscript><style>#boot{display:none!important}.nojs{display:block!important}</style></noscript>
  <style>
    /* Critical CSS do estado de carregamento padrão (“Carregando a árvore”): vive aqui para a
       primeira pintura já nascer com ele, sem flash de tela branca. O resto do sistema está em
       styles/main.css e o comportamento em components/ui-loading.js. */
    #boot { position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; justify-items: center; gap: 14px;
      background: radial-gradient(ellipse at 50% 12%, #101a4a 0%, #0A1235 35%, #050B20 75%);
      color: #DDEBFF; font: 700 1rem/1.4 'Nunito', system-ui, sans-serif; text-align: center; }
    #boot .load-pop { display: grid; color: #E9C45A; }
    #boot .flake { width: 2.9rem; height: 2.9rem; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round;
      filter: drop-shadow(0 0 10px rgba(255,231,154,.55)); animation: bootspin 2.6s linear infinite; }
    #boot .flake circle { fill: currentColor; stroke: none; }
    #boot[hidden] { display: none; }
    @keyframes bootspin { to { transform: rotate(360deg); } }
    /* O indicador inicial usa somente CSS, inclusive antes do JavaScript. */
    @media (prefers-reduced-motion: reduce) {
      /* sem rotação nem aqui: o indicador de atividade vira o pulso de opacidade do texto,
         o mesmo padrão do sistema inteiro (ui-loading.js / main.css) */
      #boot .flake { animation: none; }
      #boot .load-text { animation: bootblink 1.6s ease-in-out infinite; }
    }
    @keyframes bootblink { 50% { opacity: .5; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="forest f1"></div><div class="forest f2"></div><div class="forest f3"></div></div>
  <div id="app"></div>
  <div id="boot" class="load is-boot" role="status" aria-live="polite"><span class="load-pop"><span class="load-mark"><svg class="flake" viewBox="0 0 24 24" aria-hidden="true"><defs><path id="flk0" d="M12 12V2.4M12 5.4 9.4 3.2M12 5.4l2.6-2.2M12 8.8 10 7.1M12 8.8l2-1.7"/></defs><use href="#flk0"/><use href="#flk0" transform="rotate(60 12 12)"/><use href="#flk0" transform="rotate(120 12 12)"/><use href="#flk0" transform="rotate(180 12 12)"/><use href="#flk0" transform="rotate(240 12 12)"/><use href="#flk0" transform="rotate(300 12 12)"/></svg></span></span><p class="load-text">Carregando a árvore…</p></div>
  <noscript><p class="nojs" style="display:none;color:#fff;text-align:center;padding:2rem">O Natal Secreto precisa de JavaScript para funcionar.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
